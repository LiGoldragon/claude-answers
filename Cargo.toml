[package]
name         = "claude-answers"
version      = "0.3.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/claude-answers"
description  = "Recall your answers to Claude Code's questions from session transcripts"

[lib]
name = "claude_answers"
path = "src/lib.rs"

[[bin]]
name = "claude-answers"
path = "src/main.rs"

[dependencies]
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "b670c72d0c2cb94ad1e39b372271f6569d91e214" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "bfde3b878dd3de2991d7f605b59f57a13ef8f20b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "b922afba278d5e1430f0a52ce49898c3263e87bc" }
