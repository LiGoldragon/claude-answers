[package]
name         = "claude-answers"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/claude-answers"
description  = "Recall your answers to Claude Code's questions from session transcripts"

[lib]
name = "claude_answers"
path = "src/lib.rs"

[[bin]]
name = "claude-answers"
path = "src/main.rs"

[dependencies]
dotos = { git = "https://github.com/LiGoldragon/dotos.git", rev = "e19699933dabd09842c4423d15a704ce3d48b493" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
